<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Deby | DebySellsUtah</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Shared Website Navigation -->
    <div id="site-navigation"></div>

    <!-- Contact Page Content -->
    <main>
        <section class="contact-page">
            <h1>Contact Deby</h1>

    <p>
                Have a question about Southern Utah real estate?
                I'd love to hear from you.
    </p>

<!-- Contact Form -->
<form id="contact-form">

    <div class="form-group">
        <label for="contact-name">Your Name</label>
        <input
            type="text"
            id="contact-name"
            name="name"
            placeholder="First and last name"
            autocomplete="name"
            required
        >
    </div>

    <div class="form-group">
        <label for="contact-email">Email Address</label>
        <input
            type="email"
            id="contact-email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >
    </div>

    <div class="form-group">
        <label for="contact-interest">How Can I Help?</label>
        <select id="contact-interest" name="interest" required>
            <option value="">Please select an option</option>
            <option value="moving">Moving to Southern Utah</option>
            <option value="retiring">Retirement or Second Home</option>
            <option value="selling">Selling a Home</option>
            <option value="question">Just Have a Question</option>
        </select>
    </div>

    <div class="form-group">
        <label for="contact-message">Your Message</label>
        <textarea
            id="contact-message"
            name="message"
            rows="5"
            placeholder="Tell me a little about what you're looking for..."
            required
        ></textarea>
    </div>

    <button type="submit" class="contact-submit">
        Send Message
    </button>

    <p id="form-feedback" role="status" aria-live="polite"></p>

</form>


        </section>
    </main>

    <!-- Contact Confirmation Pop-up -->
<dialog id="contact-confirmation" aria-labelledby="confirmation-title">
    <h2 id="confirmation-title">Thank You!</h2>

    <p id="confirmation-message"></p>

    <button type="button" id="close-confirmation">
        Close
    </button>
</dialog>

    <!-- Shared Website Footer -->
    <div id="site-footer"></div>

    <script src="javascript/site.js"></script>

</body>
</html>
